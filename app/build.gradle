plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.google.devtools.ksp' }
android {
    namespace 'com.aui.llm'; compileSdk 34
    defaultConfig { applicationId "com.aui.llm"; minSdk 24; targetSdk 34; versionCode 16; versionName "16.0-GHOST-FINAL" }
    signingConfigs { release { storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks"); storePassword System.getenv("KEYSTORE_PASSWORD") ?: "123456"; keyAlias System.getenv("KEY_ALIAS") ?: "aui"; keyPassword System.getenv("KEY_PASSWORD") ?: "123456" } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release }; debug { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'com.google.android.material:material:1.11.0'; implementation 'androidx.constraintlayout:constraintlayout:2.1.4'; implementation 'androidx.recyclerview:recyclerview:1.3.2'; implementation 'androidx.security:security-crypto:1.1.0-alpha06'; implementation 'com.squareup.okhttp3:okhttp:4.12.0'; implementation 'com.google.code.gson:gson:2.10.1'; implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'; implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'; implementation 'androidx.cardview:cardview:1.0.0'; implementation 'androidx.room:room-runtime:2.6.1'; implementation 'androidx.room:room-ktx:2.6.1'; ksp 'androidx.room:room-compiler:2.6.1'; implementation 'androidx.activity:activity-ktx:1.8.2'; implementation 'androidx.fragment:fragment-ktx:1.6.2'
}
